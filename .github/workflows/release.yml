name: Build and release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Build Universal 2 application
        run: bash scripts/package-macos.sh
      - name: Usage and transport regression checks
        run: bash scripts/test.sh
      - name: Native menu and window event checks
        run: bash scripts/test-ui.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/CodexUsage-macOS-universal.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Usage and subprocess checks
        run: dotnet run --project windows/CodexUsage.Tests -c Release
      - name: Package Windows portable application
        run: ./scripts/package-windows.ps1
      - name: Native Windows UI smoke checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $Report = Join-Path $PWD 'artifacts/windows-smoke.json'
          $Process = Start-Process -FilePath ./dist/windows-win-x64/CodexUsage.exe -ArgumentList @('--self-test', "`"$Report`"") -PassThru
          if (-not $Process.WaitForExit(60000)) { $Process.Kill(); throw 'UI smoke test timed out' }
          if ($Process.ExitCode -ne 0) {
            if (Test-Path $Report) { Get-Content $Report }
            throw 'Windows UI smoke test failed'
          }
          $Result = Get-Content $Report -Raw | ConvertFrom-Json
          if (-not $Result.passed) { throw 'Windows UI verification did not pass' }
          Get-Content $Report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-windows
          path: artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/CodexUsage-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Validate and checksum both downloads
        working-directory: release-assets
        run: |
          test -s CodexUsage-macOS-universal.zip
          test -s CodexUsage-Windows-x64.zip
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish both platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Codex Usage $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
